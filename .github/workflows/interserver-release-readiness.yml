name: Marketing website release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static publishing surface
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s sitemap.xml
          test -s docs/PUBLISHING.md
          test -s assets/site.js
          if find . -path ./.git -prune -o -type f \( -iname '*.php' -o -name '.htaccess' \) -print | grep -q .; then
            echo 'Unexpected server-executable file in marketing source' >&2
            exit 1
          fi
          for slug in frontdeskpro frontdeskai frontdeskagent; do
            test -s "${slug}/index.html"
          done
      - name: Record immutable release candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\ncommit=%s\nkind=static-marketing\nstatus=candidate-only\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > RELEASE-MANIFEST.txt
          git archive HEAD | gzip -9 > website-source.tar.gz
          sha256sum website-source.tar.gz >> RELEASE-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-candidate-${{ github.sha }}
          path: |
            website-source.tar.gz
            RELEASE-MANIFEST.txt
          retention-days: 30
