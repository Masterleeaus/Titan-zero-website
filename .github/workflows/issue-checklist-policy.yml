name: Enforce issue task checklists
on:
  issues:
    types: [opened, edited, reopened, closed]
  push:
    paths: ['.github/workflows/issue-checklist-policy.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-checklists-${{ github.repository }}
  cancel-in-progress: false
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill tasks and block incomplete issue closure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const titlePattern = /^(#{1,4})\s+(.+)$/;
            const checkboxRe = /^\s*[-*]\s+\[([ xX])\]\s+\S/gm;
            const actionRe = /^(add|implement|verify|test|build|create|define|fix|migrate|ensure|remove|preserve|protect|update|document|enforce|connect|integrate|support|recover|handle|refactor|provide|replace|validate|reconcile|expose|run|release|publish|return|trace|port|map|restrict|prevent|audit|deploy|correct|align|split|ship|write|use|require|confirm|allow|block|check|record|move|configure|resolve|retain|establish|register|generate|compare|cover|introduce|design)\b/i;
            function checklist(text) {
              return [...(text || '').matchAll(checkboxRe)].map(m => m[1].toLowerCase() === 'x');
            }
            function deriveTasks(issue) {
              let source = (issue.body || '').split(/^#{2,3}\s+(?:historical scope|superseded scope|previous plan)\b/im)[0];
              const tasks = [], seen = new Set();
              let section = '', code = false;
              const acceptedSection = /(implementation|scope|deliver|work|task|requirement|accept|done|fix|feature|policy|capabilit|enhancement|test|integration|security|design|migration|verification)/i;
              const consider = value => {
                let t = value.replace(/^\s*(?:[-*]|\d+[.)])\s+/, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                  .replace(/`/g, '').replace(/\*\*/g, '').replace(/\s+/g, ' ').trim();
                if (t.length < 18 || /^(?:parent|related|references?|depends on|see also|source:|generated by|http[s]?:)/i.test(t)) return;
                if (t.length > 300) t = t.slice(0, 297).replace(/\s+\S*$/, '') + '…';
                if (!actionRe.test(t)) t = 'Implement and verify: ' + t.replace(/[. ]+$/, '');
                t = t.replace(/[. ]+$/, '');
                const key = t.toLowerCase();
                if (!seen.has(key) && tasks.length < 7) { tasks.push(t); seen.add(key); }
              };
              for (const raw of source.split('\n')) {
                const line = raw.trim();
                if (/^```|^~~~/.test(line)) { code = !code; continue; }
                if (code || !line || /^---+$/.test(line) || /^>/.test(line)) continue;
                const h = line.match(titlePattern);
                if (h) { section = h[2]; continue; }
                if (line.startsWith('<!--') || /^\[.*\]:/.test(line)) continue;
                if (acceptedSection.test(section) || /^[-*]\s/.test(line)) {
                  const pieces = line.split(/;\s+(?=[A-Z])|(?<=\.)\s+(?=[A-Z][a-z])/);
                  for (const p of pieces) consider(p);
                }
              }
              if (/front-desk-pro$/i.test(repo)) {
                tasks.unshift('Triage this historical Pro feature into the single Free WordPress plugin and/or optional hosted Assistant/Agent Team; do not create another Pro add-on');
              }
              if (tasks.length === 0) tasks.push('Define concrete implementation subtasks from the issue scope and identify the authoritative source modules');
              tasks.push('Implement the outstanding changes in the authoritative repository and link the relevant commits or pull requests');
              tasks.push('Add or update automated regression, authorization and integration tests appropriate to the change');
              tasks.push('Run applicable CI checks, verify acceptance criteria, and record reproducible evidence before closure');
              return tasks.slice(0, 11);
            }
            async function inspect(issue) {
              if (!issue || issue.pull_request) return;
              const checks = checklist(issue.body);
              if (issue.state === 'closed') {
                if (checks.length === 0 || checks.some(v => !v)) {
                  await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'open',state_reason:'reopened'});
                  await github.rest.issues.createComment({owner,repo,issue_number:issue.number,
                    body:'Issue reopened by the checklist policy: closing requires an actionable task checklist with **every item checked**. Complete and verify the outstanding work before closing.'});
                  core.notice('Reopened issue #' + issue.number + ': unchecked or missing tasks');
                }
                return;
              }
              if (checks.length) return;
              const additions = deriveTasks(issue).map(t => '- [ ] ' + t).join('\n');
              const body = (issue.body || '').trimEnd() + '\n\n## Implementation checklist\n\n' +
                '<!-- checklist-policy:v1 — review and refine auto-extracted tasks; only check items with verified evidence -->\n' +
                additions + '\n';
              await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
              core.notice('Added task checklist to issue #' + issue.number);
            }
            if (context.eventName === 'issues') {
              await inspect(context.payload.issue);
            } else {
              const issues = await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
              for (const issue of issues) await inspect(issue);
              core.notice('Audited ' + issues.filter(i => !i.pull_request).length + ' open issues');
            }
