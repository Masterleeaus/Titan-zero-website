name: InterServer marketing staging upload
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interserver-marketing-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check isolated staging target
        env:
          STAGING_RELEASE_DIR: ${{ vars.STAGING_RELEASE_DIR }}
          INTERSERVER_SSH_HOST: ${{ secrets.INTERSERVER_SSH_HOST }}
          INTERSERVER_SSH_USER: ${{ secrets.INTERSERVER_SSH_USER }}
          INTERSERVER_SSH_PRIVATE_KEY: ${{ secrets.INTERSERVER_SSH_PRIVATE_KEY }}
          INTERSERVER_SSH_KNOWN_HOSTS: ${{ secrets.INTERSERVER_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INTERSERVER_SSH_HOST" && test -n "$INTERSERVER_SSH_USER"
          test -n "$INTERSERVER_SSH_PRIVATE_KEY" && test -n "$INTERSERVER_SSH_KNOWN_HOSTS"
          # Refuse production webroot, generic directories and unexpected targets.
          [[ "$STAGING_RELEASE_DIR" =~ ^/home/[A-Za-z0-9_-]+/.*/titanzero-marketing-staging$ ]]
          test -s index.html
          if find . -path ./.git -prune -o -type f \( -iname '*.php' -o -name '.htaccess' \) -print | grep -q .; then
            echo 'Executable server file detected; refusing staged upload' >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$INTERSERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$INTERSERVER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "$INTERSERVER_SSH_USER@$INTERSERVER_SSH_HOST" 'echo "Authenticated staging deploy account"'
          ssh -o StrictHostKeyChecking=yes "$INTERSERVER_SSH_USER@$INTERSERVER_SSH_HOST" "mkdir -p '$STAGING_RELEASE_DIR/$GITHUB_SHA'"
          rsync -az --exclude '.git/' --exclude '.github/' --exclude 'docs/' --exclude 'pages/' \
            --exclude 'scripts/' --exclude 'node_modules/' --exclude '*.md' \
            -e 'ssh -o StrictHostKeyChecking=yes' ./ \
            "$INTERSERVER_SSH_USER@$INTERSERVER_SSH_HOST:$STAGING_RELEASE_DIR/$GITHUB_SHA/"
          echo "Staged commit $GITHUB_SHA (no production webroot changed)."
