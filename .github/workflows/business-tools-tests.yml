name: Business tools calculation regression
on:
  pull_request:
    paths:
      - 'assets/tools.js'
      - 'scripts/test-break-even.mjs'
      - 'assets/tool-calcs.js'
      - 'tests/**'
      - 'pages/tool-*.html'
      - '.github/workflows/business-tools-tests.yml'
  push:
    branches: [main]
    paths:
      - 'assets/tools.js'
      - 'scripts/test-break-even.mjs'
      - 'assets/tool-calcs.js'
      - 'tests/**'
      - 'pages/tool-*.html'
      - '.github/workflows/business-tools-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/tools.js
      - run: node scripts/test-break-even.mjs
      - run: node --test tests/break-even.test.mjs tests/tools-handoff-privacy.test.mjs tests/tool-calcs.test.mjs
