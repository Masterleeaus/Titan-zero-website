name: Business tools financial regression
on:
  pull_request:
    paths:
      - 'assets/tools.js'
      - 'assets/tools-engine.js'
      - 'assets/site.js'
      - 'pages/tool-*.html'
      - 'tools/**'
      - 'scripts/check-tool-parity.mjs'
      - 'scripts/check-tool-a11y.mjs'
      - 'scripts/tools-dom-smoke.cjs'
      - 'scripts/tools-browser-smoke.mjs'
      - 'scripts/tools-release-check.mjs'
      - 'assets/styles.css'
      - 'assets/site-data.js'
      - 'scripts/tools-browser-check.mjs'
      - 'scripts/site-gate.mjs'
      - 'tests/**'
      - '.github/workflows/tools-regression.yml'
  push:
    branches: [main]
    paths:
      - 'assets/tools.js'
      - 'assets/tools-engine.js'
      - 'assets/site.js'
      - 'pages/tool-*.html'
      - 'tools/**'
      - 'scripts/check-tool-parity.mjs'
      - 'tests/**'
permissions:
  contents: read
jobs:
  break-even:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/tools-engine.js
      - run: node --check assets/tools.js
      - run: node --check assets/site.js
      - run: node --test tests/break-even.test.mjs tests/tools-engine.test.mjs tests/tools-handoff-privacy.test.mjs tests/tools-legacy-url-privacy.test.mjs
      - run: node scripts/test-break-even.mjs
      - run: node scripts/check-tool-parity.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-tool-a11y.mjs
      - run: node scripts/site-gate.mjs check
      - name: Install jsdom into a temporary folder (not a repository dependency)
        run: npm install --prefix "$RUNNER_TEMP/dom" jsdom@24 --no-audit --no-fund
      - name: DOM smoke test of the live calculators (#23, #42, #43)
        run: JSDOM_DIR="$RUNNER_TEMP/dom" node scripts/tools-dom-smoke.cjs
  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tool test helpers into a temporary folder (not repository dependencies)
        run: npm install --prefix "$RUNNER_TEMP/tools-deps" jsdom@24 puppeteer-core@23 --no-audit --no-fund
      - name: Business tools release check (#46)
        env:
          JSDOM_DIR: ${{ runner.temp }}/tools-deps
          PUPPETEER_DIR: ${{ runner.temp }}/tools-deps
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/tools-release-check.mjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright into a temporary folder (not a repository dependency)
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0 --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: "$RUNNER_TEMP/pw/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser run on the 19 calculator pages at phone and desktop widths (#108)
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          TOOLS_BROWSER_REPORT: ${{ runner.temp }}/tools-browser-report.json
        run: node scripts/tools-browser-check.mjs
      - name: Keep the browser report for the release checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-browser-report
          path: ${{ runner.temp }}/tools-browser-report.json
          if-no-files-found: warn
